<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Himnario Adventista del Séptimo Día | 613 Himnos</title>
    <meta
      name="description"
      content="Himnario Adventista del Séptimo Día con 613 himnos. Consulta las letras, escucha audios cantados e instrumentales y utiliza el modo karaoke."
    />
    <link rel="canonical" href="https://himnario-adventista.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Himnario Adventista" />
    <meta
      property="og:title"
      content="Himnario Adventista del Séptimo Día | 613 Himnos"
    />
    <meta
      property="og:description"
      content="Himnario Adventista del Séptimo Día con 613 himnos. Consulta las letras, escucha audios cantados e instrumentales y utiliza el modo karaoke."
    />
    <meta property="og:url" content="https://himnario-adventista.pages.dev/" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/css/index.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400&amp;family=Nunito:wght@400;600&amp;display=swap"
    />
    <link rel="stylesheet" href="/src/css/typography.css" />
  </head>

  <body>
    <main id="app">
      <!-- ============================= -->
      <!-- VISTA INICIO                  -->
      <!-- ============================= -->
      <section id="view-home" class="view">
        <button
          id="home-fullscreen"
          class="home-fullscreen"
          type="button"
          aria-label="Pantalla completa"
          aria-pressed="false"
        >
          ⛶
        </button>

        <h1 class="app-title">Himnario Adventista</h1>

        <div class="search-container">
          <form id="search-form">
            <div id="search-selected" class="search-selected" hidden>
              <span id="search-selected-number" class="search-selected-number"></span>
              <span id="search-selected-title" class="search-selected-title"></span>
              <button
                id="search-selected-clear"
                class="search-selected-clear"
                type="button"
                aria-label="Quitar selección"
              >
                ✕
              </button>
            </div>

            <input
              id="search-input"
              type="search"
              name="buscar"
              placeholder="Número o título"
              autocomplete="off"
              required
            />

            <button
              type="submit"
              aria-label="Reproducir himno"
              title="Reproducir himno (Enter)"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
          </form>

          <div id="search-suggestions"></div>
        </div>

        <div class="selector" role="group" aria-label="Modo de reproducción">
          <button
            class="opcion"
            data-value="lyrics"
            type="button"
            title="Solo letra"
            aria-pressed="false"
          >
            <img src="/src/assets/icons/letra.png" alt="" aria-hidden="true" />
            <span>Letra</span>
          </button>

          <button
            class="opcion"
            data-value="sung"
            type="button"
            title="Cantado"
            aria-pressed="true"
          >
            <img src="/src/assets/icons/musica.png" alt="" aria-hidden="true" />
            <span>Cantado</span>
          </button>

          <button
            class="opcion"
            data-value="karaoke"
            type="button"
            title="Karaoke"
            aria-pressed="false"
          >
            <img src="/src/assets/icons/instrumental.png" alt="" aria-hidden="true" />
            <span>Karaoke</span>
          </button>
        </div>

        <footer class="home-footer">
          <nav aria-label="Catálogo de himnos">
            <a href="/himnos">Ver todos los himnos</a>
          </nav>
        </footer>
      </section>

      <!-- ============================= -->
      <!-- VISTA HIMNO /X                -->
      <!-- ============================= -->
      <section id="view-hymn" class="view" hidden>
        <header id="hymn-topbar" class="hymn-topbar" hidden>
          <button id="hymn-back" class="hymn-icon-btn" type="button">←</button>

          <div class="hymn-heading">
            <div class="hymn-title-row">
              <span id="hymn-number" class="hymn-number"></span>
              <h1 id="hymn-title" class="hymn-title"></h1>
            </div>
            <span id="hymn-reference" class="hymn-reference"></span>
          </div>

          <button id="hymn-fullscreen" class="hymn-icon-btn" type="button">
            ⛶
          </button>
        </header>

        <p id="hymn-notice" class="hymn-notice" hidden></p>

        <div id="hymn-notfound" class="hymn-notfound" hidden>
          <p class="hymn-notfound-title">Himno no encontrado</p>
          <button id="hymn-home" class="hymn-home-btn" type="button">
            Volver al inicio
          </button>
        </div>

        <div id="hymn-content" class="hymn-content">
          <!-- Presentación inicial: número + título -->
          <div id="hymn-intro" class="hymn-intro" hidden>
            <span id="intro-number" class="intro-number"></span>
            <h1 id="intro-title" class="intro-title"></h1>
          </div>

          <span
            id="lyric-section"
            class="lyric-section"
            aria-live="polite"
            hidden
          ></span>
          <div id="lyrics-stage" class="lyrics-stage" hidden>
            <p id="lyric-previous" class="lyric-previous" hidden></p>
            <p id="lyric-current" class="lyric-current"></p>
            <p id="lyric-next" class="lyric-next"></p>
          </div>

          <ul id="lyrics-list" class="lyrics-list" hidden></ul>

          <nav id="hymn-nav" class="hymn-nav" hidden>
            <button
              id="hymn-prev"
              class="hymn-arrow"
              type="button"
              aria-label="Anterior"
            >
              ←
            </button>

            <span id="hymn-counter" class="hymn-counter"></span>

            <button
              id="hymn-next"
              class="hymn-arrow"
              type="button"
              aria-label="Siguiente"
            >
              →
            </button>
          </nav>

          <!-- El audio se reproduce internamente, sin controles visibles -->
          <div id="hymn-audio-wrap" class="hymn-audio-hidden" hidden>
            <audio id="hymn-audio" preload="auto"></audio>
          </div>

          <button id="hymn-start" class="hymn-start" type="button" hidden>
            ▶ Comenzar
          </button>

          <div id="hymn-state-icon" class="hymn-state-icon" hidden></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
